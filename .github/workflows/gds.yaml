name: gds

# The project's GDS is hardened locally (harden/, the DFFRAM-macro flow on
# the 4x4 tile; RESPIN.md's hardening section) and committed to gds/, lef/
# and pnl/: this workflow publishes that as the submission's GDS artifact,
# runs the Tiny Tapeout precheck on it and deploys the 2D / 3D viewer to
# the repo's GitHub Pages (https://kdp1965.github.io/ttsky26d-um-lisa-ttlc/).
# It runs on every push, like test and docs (it was gds_custom.yaml, run by
# hand, until 2026-10-18; the standard flow, hardening in the action, is
# out of reach on this tile - see RESPIN.md).

on:
  push:
  workflow_dispatch:

jobs:
  gds:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repo
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Read top module name
        uses: mikefarah/yq@v4
        id: top_module
        with:
          cmd: echo TOP_MODULE=`yq '.project.top_module' info.yaml` > $GITHUB_OUTPUT

      - name: Create and publish the GDS artifact
        uses: TinyTapeout/tt-gds-action/custom_gds@ttsky26d
        with:
          pdk: sky130A
          top_module: ${{ steps.top_module.outputs.TOP_MODULE }}
          gds_path: gds/${{ steps.top_module.outputs.TOP_MODULE }}.gds
          lef_path: lef/${{ steps.top_module.outputs.TOP_MODULE }}.lef
          verilog_path: pnl/${{ steps.top_module.outputs.TOP_MODULE }}.pnl.v

  precheck:
    needs: gds
    runs-on: ubuntu-24.04
    steps:
      - name: Run Tiny Tapeout Precheck
        uses: TinyTapeout/tt-gds-action/precheck@ttsky26d

  viewer:
    needs: gds
    runs-on: ubuntu-24.04
    permissions:
      pages: write      # to deploy to Pages
      id-token: write   # to verify the deployment originates from an appropriate source
    steps:
      - uses: TinyTapeout/tt-gds-action/viewer@ttsky26d
